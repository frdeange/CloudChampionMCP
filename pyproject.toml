[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-cloudchampion"
version = "0.1.0"
description = "MCP Server para el catálogo de formación de Cloud Champion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
mcp-cloudchampion = "mcp_cloudchampion.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cloudchampion"]
